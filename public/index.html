<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4B48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uniqon">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Uniqon Home Center</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F1EC; --panel:#FFFFFF; --ink:#4A4A4C; --teal:#1F4B48; --gold:#B3A46A; --muted:#6B6F76; --line:#D8DBDF;
  --in:#1E7B57; --in-soft:#DDF0E7; --out:#8E2F2F; --out-soft:#F5E1E1; --focus:#2F5D9E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{background:#fff;color:var(--ink);border-bottom:4px solid var(--gold);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:54px;width:auto;display:block}.brand small{font-size:13px;font-weight:600;color:var(--teal);letter-spacing:.06em;text-transform:uppercase;border-inline-start:2px solid var(--gold);padding-inline-start:12px}
header .who{font-size:14px;color:var(--muted);text-align:end;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
header button{background:#fff;border:1px solid var(--teal);color:var(--teal);border-radius:6px;padding:6px 12px;cursor:pointer}
main{max-width:880px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 6px;font-weight:600}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
p.hint{color:var(--muted);margin:0 0 16px}
label{display:block;font-weight:500;margin:14px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid #B8BCC2;border-radius:6px;background:#fff}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;font-weight:500}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid #B8BCC2}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.err{background:var(--out-soft);color:var(--out);padding:10px 12px;border-radius:6px;margin-top:14px}
.ok{background:var(--in-soft);color:var(--in);padding:10px 12px;border-radius:6px;margin-top:14px}
.login{max-width:420px;margin:40px auto}
.clock{text-align:center}
.time{font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.date{color:var(--muted);margin-top:4px}
.badge{display:inline-block;margin:18px 0 6px;padding:5px 14px;border-radius:99px;font-weight:600;font-size:15px}
.badge.in{background:var(--in-soft);color:var(--in)}
.badge.out{background:#E4E6E9;color:#4b4f55}
.punch{display:block;width:100%;max-width:420px;margin:14px auto 0;border:0;border-radius:10px;padding:22px;font-size:22px;font-weight:600;color:#fff;cursor:pointer}
.punch.in{background:var(--in)} .punch.out{background:var(--out)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:14px}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{background:#fff;border:1px solid #B8BCC2;border-radius:6px;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:150px}
.pill{font-size:13px;padding:2px 8px;border-radius:99px;background:#E4E6E9}
.pill.off{background:var(--out-soft);color:var(--out)}
.secret{font-family:ui-monospace,Consolas,monospace;font-size:20px;background:#F3F4F6;padding:2px 8px;border-radius:4px}
.empty{color:var(--muted);padding:12px 0}
.hidden{display:none}
@media (max-width:520px){.time{font-size:60px}header .who span{display:none}.brand img{height:40px}.brand small{display:none}}
.pwwrap{position:relative}.pwwrap input{padding-inline-end:70px;width:100%;box-sizing:border-box}.pwtoggle{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#2563EB;font-size:14px;cursor:pointer;padding:6px}
textarea{font:inherit;color:inherit;width:100%;padding:11px 12px;border:1px solid #B8BCC2;border-radius:6px;background:#fff;min-height:90px;resize:vertical}
.sec{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--teal);border-bottom:2px solid var(--gold);padding-bottom:4px;margin:26px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.rep dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0}
.rep dt{color:var(--muted)} .rep dd{margin:0}
.rep .txt{white-space:pre-wrap;margin:4px 0 0}
details.rep{border-bottom:1px solid var(--line);padding:10px 0}
details.rep summary{cursor:pointer;font-weight:500}
@media print{header .who,.tabs,.noprint{display:none!important}.card{border:0}details.rep{break-inside:avoid}}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea{font-family:Vazirmatn,Barlow,system-ui,sans-serif}
[dir=rtl] .sec{letter-spacing:0}
[dir=rtl] input[type=email],[dir=rtl] input[type=number],[dir=rtl] input[type=date],[dir=rtl] input[type=time],[dir=rtl] #id{direction:ltr;text-align:right}
.langbtn{font-weight:600}
/* ---------- Phones ---------- */
html{-webkit-text-size-adjust:100%}
button,.btn,select,input,textarea{touch-action:manipulation}
@media (max-width:640px){
  header{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:20}
  .brand img{height:36px}
  header .who{gap:6px}
  header button{padding:8px 10px}
  main{padding:12px 10px calc(90px + env(safe-area-inset-bottom))}
  .card{padding:16px 14px;border-radius:12px;margin-bottom:12px}
  h1{font-size:20px}
  /* 16px+ inputs stop iOS from zooming in; taller touch targets */
  input,select,textarea{font-size:16px;min-height:46px}
  textarea{min-height:110px}
  .btn{min-height:46px}
  .btn.small{min-height:40px;padding:8px 12px}
  .tabs{position:sticky;top:60px;z-index:15;background:var(--bg);margin:-12px -10px 12px;padding:10px;overflow-x:auto;flex-wrap:nowrap}
  .tabs button{flex:1 0 auto;padding:10px 12px;white-space:nowrap}
  .row{gap:8px}
  .row>div{flex:1 1 100%!important;min-width:0}
  .row .btn{width:100%}
  .row>.locbtns{display:flex;gap:8px;white-space:normal!important}
  .locbtns .btn{flex:1;width:auto}
  html,body{overflow-x:hidden}
  .login{margin:16px auto}
  /* Submit button stays reachable at the bottom of the screen */
  #rf>.btn{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:10}
  .rep dl{grid-template-columns:1fr}
  .rep dt{margin-top:6px;font-size:13px}
  details.rep summary{padding:6px 0;line-height:1.35}
  /* Employee table becomes stacked cards */
  #list table,#list thead,#list tbody,#list tr,#list td{display:block;width:100%}
  #list thead{display:none}
  #list tr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
  #list td{border:0;padding:4px 0}
  #list td:first-child{font-weight:600;color:var(--muted)}
  #list td input{width:100%}
  #list td .btn{margin:4px 4px 0 0}
  .secret{font-size:18px;word-break:break-all}
}
</style>
</head>

const ORIG = new WeakMap();
function translateDom(root = document.body) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) {
    const p = n.parentElement;
    if (!p || p.closest('script,style,textarea,.secret,[data-notr]')) continue;
    if (!ORIG.has(n)) { const k = n.nodeValue.trim(); if (!k || !(k in FA)) continue; ORIG.set(n, n.nodeValue); }
    const o = ORIG.get(n), k = o.trim();
    const v = lang === 'fa' ? o.replace(k, FA[k]) : o;
    if (n.nodeValue !== v) n.nodeValue = v;
  }
  const els = root.querySelectorAll ? root.querySelectorAll('[placeholder]') : [];
  els.forEach(el => {
    if (!el.dataset.ph) { if (!(el.placeholder in FA)) return; el.dataset.ph = el.placeholder; }
    el.placeholder = lang === 'fa' ? FA[el.dataset.ph] : el.dataset.ph;
  });
}
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  $('#langBtn').textContent = lang === 'fa' ? 'English' : 'فارسی';
  translateDom();
}
$('#langBtn').onclick = () => {
  lang = lang === 'fa' ? 'en' : 'fa';
  try { localStorage.setItem('uniqon_lang', lang); } catch {}
  applyLang();
};
// "Show" button on every password field + no autocorrect/autocapitalize
new MutationObserver(() => {
  document.querySelectorAll('input[type=password]:not([data-pw])').forEach(inp => {
    inp.dataset.pw = 1;
    inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('autocorrect', 'off'); inp.spellcheck = false;
    const wrap = document.createElement('div'); wrap.className = 'pwwrap';
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pwtoggle'; b.textContent = 'Show';
    b.onclick = () => { const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; };
    wrap.appendChild(b);
  });
  if (lang === 'fa') translateDom();
}).observe(document.body, {childList: true, subtree: true});
let me = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT = ts => new Date(ts).toLocaleString(LOC(), {timeZone: TZ, weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
const fmtT = ts => new Date(ts).toLocaleTimeString(LOC(), {timeZone: TZ, hour:'numeric', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString(LOC(), {timeZone: TZ, weekday:'short', month:'short', day:'numeric'});
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString(LOC(), {weekday:'short', month:'short', day:'numeric', year:'numeric'});
const hm = m => m == null ? 'In progress' : Math.floor(m/60) + ' h ' + String(m%60).padStart(2,'0') + ' min';
const money = v => v == null || v === '' ? '—' : '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => v == null || v === '' ? '—' : String(v);
function todayStr(d = new Date()) { return d.toLocaleDateString('en-CA', {timeZone: TZ}); }

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: {'Content-Type':'application/json'},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Error'); e.status = res.status; throw e; }
  return data;
}

function header() {
  $('#who').classList.toggle('hidden', !me);
  $('#logoutBtn').classList.toggle('hidden', !me);
  if (me) $('#whoName').textContent = me.name + ' (ID ' + me.emp_number + ')';
}
$('#logoutBtn').onclick = async () => { await api('/logout', {method:'POST'}); me = null; route(); };

async function route() {
  clearInterval(window._tick);
  const reset = location.hash.match(/^#reset=([a-f0-9]{64})$/);
  if (reset) { me = null; header(); return viewReset(reset[1]); }
  try { me = await api('/me'); } catch { me = null; }
  header();
  if (!me) return viewLogin();
  if (me.must_change) return viewChange();
  if (me.role === 'admin') return viewAdmin();
  return viewEmployee();
}

function tabs(names, onSel) {
  app.innerHTML = `<div class="tabs" role="tablist">${names.map((n, i) => `<button role="tab" data-tab="${i}" aria-selected="${i===0}">${n}</button>`).join('')}</div><div id="panel"></div>`;
  const btns = [...document.querySelectorAll('[data-tab]')];
  const sel = i => { clearInterval(window._tick); btns.forEach((b, j) => b.setAttribute('aria-selected', i === j)); onSel(i); };
  btns.forEach((b, i) => b.onclick = () => sel(i));
  sel(0);
}

const nIn = (id, label, money) => `<div><label for="${id}">${label}</label><input id="${id}" type="number" min="0" step="${money ? '0.01' : '1'}" inputmode="${money ? 'decimal' : 'numeric'}"></div>`;

const area = (id, label) => `<label for="${id}">${label}</label><textarea id="${id}"></textarea>`;
const REPORT_FIELDS = ['opening','closing','walk_ins','calls','quotations','orders','total_sales','payments_received','daily_expenses','payment_methods','completed_work','pending_followups','issues','prepared_by','signature'];

function empReport() {

    $('#msg').innerHTML = '';

    } catch (er) { $('#msg').innerHTML = '<div class="err">' + esc(t(er.message)) + '</div>'; }
  };
  loadLocs().then(load);
}

function dateRange(title, extra = '') {
  const first = new Date(); first.setDate(first.getDate() - 6);
  return `
    <h2>${title}</h2>
    <div class="row noprint">
      <div><label for="from" style="margin-top:0">From</label><input id="from" type="date" value="${todayStr(first)}"></div>
      <div><label for="to" style="margin-top:0">To</label><input id="to" type="date" value="${todayStr()}"></div>
      <div style="flex:0"><button class="btn" id="go">View</button></div>
      ${extra}
    </div>`;
}

function downloadCsv(name, rows) {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = name;
  a.click();
}

      <div><label for="nm" style="margin-top:0">Full name</label><input id="nm" required></div>
      <div><label for="em" style="margin-top:0">Email</label><input id="em" type="email" required></div>
      <div><label for="tt" style="margin-top:0">Job title</label><input id="tt" placeholder="e.g. Superintendent, Sales" list="titles"></div>
      <div style="flex:0"><button class="btn">Create</button></div>
    </form>
    <div id="msg"></div>
  </section>
  <section class="card">
    <h2>Employees</h2>
    <p class="hint">Edit a name or job title directly in the table — it saves automatically.</p>
    <datalist id="titles"></datalist>
    <div id="list" class="tablewrap"></div>
  </section>`;
  async function list() {
    const rows = await api('/admin/employees');
    $('#list').innerHTML = '<table><thead><tr><th>ID</th><th>Name</th><th>Job title</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody>' +
      rows.map(r => `<tr><td>${esc(r.emp_number)}</td><td><input data-name="${r.id}" value="${esc(r.name)}" required style="min-width:150px;padding:6px 8px">${r.role==='admin'?' <span class="pill">Admin</span>':''}</td><td><input data-title="${r.id}" value="${esc(r.title)}" placeholder="Add title" list="titles" style="min-width:150px;padding:6px 8px"></td><td>${esc(r.email)}</td>
        <td>${r.active ? 'Active' : '<span class="pill off">Inactive</span>'}</td>
        <td style="white-space:nowrap">
          <button class="btn secondary small" data-reset="${r.id}">Send reset email</button>
          ${r.id !== me.id ? `<button class="btn secondary small" data-active="${r.id}" data-to="${r.active?0:1}">${r.active?'Deactivate':'Activate'}</button>` : ''}
        </td></tr>`).join('') + '</tbody></table>';
    $('#titles').innerHTML = [...new Set(['Superintendent','Project Manager','Sales Associate','Store Manager','Designer','Installer', ...rows.map(r => r.title).filter(Boolean)])].map(t => `<option value="${esc(t)}">`).join('');
    document.querySelectorAll('[data-name]').forEach(inp => inp.onchange = async () => {
      try {
        await api('/admin/employees/' + inp.dataset.name + '/name', {method:'POST', body:{name: inp.value}});
        inp.style.borderColor = 'var(--in)';
        if (Number(inp.dataset.name) === me.id) { me.name = inp.value.trim(); header(); }
      } catch (er) { inp.style.borderColor = 'var(--out)'; $('#msg').innerHTML = '<div class="err">' + esc(t(er.message)) + '</div>'; }
    });
    document.querySelectorAll('[data-title]').forEach(inp => inp.onchange = async () => {
      try { await api('/admin/employees/' + inp.dataset.title + '/title', {method:'POST', body:{title: inp.value}}); inp.style.borderColor = 'var(--in)'; }
      catch (er) { $('#msg').innerHTML = '<div class="err">' + esc(t(er.message)) + '</div>'; }
    });
    document.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
      if (!confirm(t('Send a password reset email to this employee?'))) return;
      try {
        const r = await api('/admin/employees/' + b.dataset.reset + '/reset', {method:'POST'});
        $('#msg').innerHTML = '<div class="ok">' + esc(t('Reset email sent to {email}.', {email: r.email})) + '</div>';
      } catch (er) { $('#msg').innerHTML = '<div class="err">' + esc(t(er.message)) + '</div>'; }
    });
    document.querySelectorAll('[data-active]').forEach(b => b.onclick = async () => {
      await api('/admin/employees/' + b.dataset.active + '/active', {method:'POST', body:{active: b.dataset.to === '1'}});
      list();
    });
  }
  $('#f').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await api('/admin/employees', {method:'POST', body:{name:$('#nm').value, email:$('#em').value, title:$('#tt').value}});
      $('#msg').innerHTML = '<div class="ok">' + esc(t('Employee created: {name}', {name: r.name})) + ' (ID ' + esc(r.emp_number) + ')<br>' +
        (r.emailed ? esc(t('Login details were emailed to {email}. Temporary password: {pw}', {email: r.email, pw: r.temp_password}))
                   : '</div><div class="err">' + esc(t('The email could not be sent. Give these details to the employee in person — ID: {id}, temporary password: {pw}', {id: r.emp_number, pw: r.temp_password}))) + '</div>';
      $('#f').reset(); list();
    } catch (er) { $('#msg').innerHTML = '<div class="err">' + esc(t(er.message)) + '</div>'; }
  };
  list();
}

applyLang();
route();
</script>
</body>
</html>
